name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - run: ./mvnw -B verify

  ui-headless:
    runs-on: ubuntu-latest
    # Informative for now: a couple of these tests are still unstable, and they shouldn't hold back the packages.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - run: ./mvnw -B verify -Pheadless-ui

  windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Install WiX 3 (for the .msi)
        continue-on-error: true
        shell: pwsh
        run: |
          choco install wixtoolset --no-progress -y
          $wix = Get-ChildItem "C:\Program Files (x86)" -Directory -Filter "WiX Toolset v3*" | Select-Object -First 1
          if ($wix) { Add-Content $env:GITHUB_PATH "$($wix.FullName)\bin" }
      - name: Package
        shell: pwsh
        run: .\package.ps1
      - uses: actions/upload-artifact@v5
        with:
          name: unichat-windows
          path: |
            release/*.zip
            release/*.msi
          if-no-files-found: error
          # Private repo on the free plan: artifact storage is 0.5 GB for the whole month (billed in GB-hours), and a
          # build uploads ~350 MB. One day each fits ~45 builds a month; longer blocked uploads until the next month.
          retention-days: 1

  macos:
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - run: ./package.sh
      - uses: actions/upload-artifact@v5
        with:
          name: unichat-macos
          path: release/*.dmg
          retention-days: 1
