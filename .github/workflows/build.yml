name: build

on:
  push:
    branches: [main]
    # A tag v<version of the pom> also publishes the packages as a GitHub release (job "release").
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - run: ./mvnw -B verify

  ui-headless:
    runs-on: ubuntu-latest
    # Informative for now: a couple of these tests are still unstable, and they shouldn't hold back the packages.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      # JavaFX plays video on Linux through the system's FFmpeg libraries (libavcodec/libavformat).
      - run: sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends ffmpeg
      - run: ./mvnw -B verify -Pheadless-ui

  windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Install WiX 3 (for the .msi)
        continue-on-error: true
        shell: pwsh
        run: |
          choco install wixtoolset --no-progress -y
          $wix = Get-ChildItem "C:\Program Files (x86)" -Directory -Filter "WiX Toolset v3*" | Select-Object -First 1
          if ($wix) { Add-Content $env:GITHUB_PATH "$($wix.FullName)\bin" }
      - name: Package
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: .\package.ps1
      - uses: actions/upload-artifact@v5
        with:
          name: unichat-windows
          path: |
            release/*.zip
            release/*.msi
          if-no-files-found: error
          # Private repo on the free plan: artifact storage is 0.5 GB for the whole month (billed in GB-hours), and a
          # build uploads ~350 MB. One day each fits ~45 builds a month; longer blocked uploads until the next month.
          retention-days: 1

  macos:
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - run: ./package.sh
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/upload-artifact@v5
        with:
          name: unichat-macos
          path: release/*.dmg
          retention-days: 1

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - name: The tag is the pom's version
        run: |
          pom="$(sed -n 's:^  <version>\(.*\)</version>:\1:p' pom.xml | head -1)"
          [ "v$pom" = "$GITHUB_REF_NAME" ] || { echo "Tag $GITHUB_REF_NAME, pom $pom: change the pom first" >&2; exit 1; }
      - uses: actions/download-artifact@v5
        with:
          path: release
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd release
          sha256sum -- * > sha256sums.txt
          # A version with a suffix (1.1.0-beta.1) is a pre-release: the app's update check skips those.
          pre=""; case "$GITHUB_REF_NAME" in *-*) pre="--prerelease" ;; esac
          # SignPath's terms: every release page links the code signing policy.
          notes="[Code signing policy](https://github.com/$GITHUB_REPOSITORY#code-signing-policy) · [Privacidad](https://github.com/$GITHUB_REPOSITORY/blob/main/docs/PRIVACIDAD.md)"
          gh release create "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" $pre --title "Unichat ${GITHUB_REF_NAME#v}" --notes "$notes" --generate-notes -- *
