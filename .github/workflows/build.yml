name: build

on:
  push:
    branches: [main]
    # A tag v<version of the pom> also publishes the packages as a GitHub release (job "release").
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - run: ./mvnw -B verify

  ui-headless:
    # 24.04: its FFmpeg 6 is one JavaFX 23 can play video with; newer Ubuntus ship FFmpeg 8, which it can't.
    runs-on: ubuntu-24.04
    # Blocking: a failing UI test fails the build (it was informative while ComposerHeightUiTest failed on Linux).
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      # JavaFX plays video on Linux through the system's FFmpeg libraries (libavcodec/libavformat).
      - run: sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends ffmpeg libasound2t64 pulseaudio libasound2-plugins
      # A runner has no sound card. ALSA's own null device drops the sound at once, so a voice note "ends" before a test
      # sees it playing: PulseAudio's null sink takes it in real time, and ALSA's default goes there.
      - run: |
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=silent
          pactl set-default-sink silent
          printf 'pcm.!default { type pulse }\nctl.!default { type pulse }\n' | sudo tee /etc/asound.conf
      - run: ./mvnw -B verify -Pheadless-ui

  dependency-check:
    # OWASP Dependency-Check: no dependency with a known CVE of CVSS 7 or more (NVD). CI only: its database is ~2 GB
    # and takes long to build, so it's cached a week at a time, each run starting from the latest and bringing it up
    # to date. False positives go in dependency-check-suppressions.xml, each with its reason.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      # No "cache: maven": this job resolves a part of the repository only, and saving it under the key the others
      # share would leave their cache short.
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "25"
      # One cache a week (GitHub keeps 10 GB a repository, and the database is ~2 GB), restored from the latest one.
      - id: week
        run: echo "week=$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"
      - id: nvd
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.dependency-check
          key: dependency-check-${{ steps.week.outputs.week }}
          restore-keys: dependency-check-
      # NVD's own data feeds (no API key needed). OSS Index is off: Sonatype now asks for an account, and without one
      # its analyzer fails the run.
      - name: No dependency with a known CVE of CVSS 7 or more
        run: >-
          ./mvnw -B org.owasp:dependency-check-maven:12.2.2:check
          -DfailBuildOnCVSS=7
          -DsuppressionFile=dependency-check-suppressions.xml
          -DdataDirectory="$HOME/.dependency-check"
          -DnvdDatafeedUrl='https://nvd.nist.gov/feeds/json/cve/2.0/nvdcve-2.0-{0}.json.gz'
          -DossIndexAnalyzerEnabled=false
      # Saved when the scan fails too (a CVE found): the next run starts from what this one downloaded.
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: always() && steps.nvd.outputs.cache-hit != 'true'
        with:
          path: ~/.dependency-check
          key: dependency-check-${{ steps.week.outputs.week }}
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        if: failure()
        with:
          name: dependency-check-report
          path: target/dependency-check-report.html
          if-no-files-found: ignore
          retention-days: 1

  lottie-windows:
    # LottieConverter for Windows (Telegram's animated stickers), cross-built here with MinGW-w64 from the sources
    # native/build-lottie.sh pins: no official build, and Linux minutes cost half of Windows'.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - run: sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends mingw-w64 cmake make
      - run: mkdir -p out && native/build-lottie.sh --windows out/lottieconverter.exe
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: lottie-windows
          path: out/lottieconverter.exe
          if-no-files-found: error
          retention-days: 1

  windows:
    needs: [test, lottie-windows]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: lottie-windows
          path: target/lottie
      - name: lottieconverter draws a sticker on Windows
        shell: bash
        run: |
          target/lottie/lottieconverter.exe src/test/resources/app/unichat/video/moving.json "$RUNNER_TEMP/moving.gif" gif 64x64 30
          test -s "$RUNNER_TEMP/moving.gif"
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: A locked session or a display off counts as nobody seeing Unichat (the real Win32 calls)
        shell: bash
        run: ./mvnw -B test -Dtest='WindowsScreen*Test,ScreenMessagesTest' -Dsurefire.failIfNoSpecifiedTests=false
      - name: Install WiX 3 (for the .msi)
        continue-on-error: true
        shell: pwsh
        run: |
          choco install wixtoolset --no-progress -y
          $wix = Get-ChildItem "C:\Program Files (x86)" -Directory -Filter "WiX Toolset v3*" | Select-Object -First 1
          if ($wix) { Add-Content $env:GITHUB_PATH "$($wix.FullName)\bin" }
      - name: Package
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: .\package.ps1
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: unichat-windows
          path: |
            release/*.zip
            release/*.msi
          if-no-files-found: error
          # Private repo on the free plan: artifact storage is 0.5 GB for the whole month (billed in GB-hours), and a
          # build uploads ~350 MB. One day each fits ~45 builds a month; longer blocked uploads until the next month.
          retention-days: 1

  macos:
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - run: ./package.sh
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: unichat-macos
          path: release/*.dmg
          retention-days: 1

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, macos, ui-headless, dependency-check]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: The tag is the pom's version
        run: |
          pom="$(sed -n 's:^  <version>\(.*\)</version>:\1:p' pom.xml | head -1)"
          [ "v$pom" = "$GITHUB_REF_NAME" ] || { echo "Tag $GITHUB_REF_NAME, pom $pom: change the pom first" >&2; exit 1; }
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          path: release
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd release
          sha256sum -- * > sha256sums.txt
          # A version with a suffix (1.1.0-beta.1) is a pre-release: the app's update check skips those.
          pre=""; case "$GITHUB_REF_NAME" in *-*) pre="--prerelease" ;; esac
          # SignPath's terms: every release page links the code signing policy.
          notes="[Code signing policy](https://github.com/$GITHUB_REPOSITORY#code-signing-policy) · [Privacy](https://github.com/$GITHUB_REPOSITORY/blob/main/docs/PRIVACY.md)"
          gh release create "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" $pre --title "Unichat ${GITHUB_REF_NAME#v}" --notes "$notes" --generate-notes -- *
