# What Unichat builds itself for its no-Docker server, published as the release named by NATIVES in versions.env:
#   tuwunel-darwin-arm64, tuwunel-windows-amd64   the homeserver (no official macOS/Windows builds)
#   mautrix-<bridge>-windows-amd64                the bridges for Windows (mautrix publishes Linux and macOS only)
#   mautrix-<bridge>-darwin-arm64                 the bridges in NATIVES_ALL: patched, or at a commit with no release
#   sha256sums.txt                                copied into the app's pins by native/pin-hashes.sh
# Each bridge is built from the exact commit its tag (or commit) names, with native/patches/<bridge>/*.patch applied;
# a patch that doesn't apply fails the build. The release notes name each commit and each patch.
# Runs when versions.env changes and that release doesn't exist yet: bump NATIVES with any version there.
name: natives

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - src/main/resources/app/unichat/server/versions.env
      - native/patches/**
      - .github/workflows/natives.yml

# Read-only for the jobs that build third-party code (their build scripts run with this token): only publish writes.
permissions:
  contents: read

env:
  # The oldest macOS Unichat runs on (package.sh's MACOS_MIN): a macOS bridge built for the runner's own would not start.
  MACOS_MIN: "13.3"

concurrency:
  group: natives
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.plan.outputs.tag }}
      exists: ${{ steps.plan.outputs.exists }}
      builds: ${{ steps.plan.outputs.builds }}
      tuwunel: ${{ steps.plan.outputs.tuwunel }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'EOF' >> "$GITHUB_OUTPUT"
          import json, os, re, subprocess, sys
          bridges, settings = [], {}
          for line in open("src/main/resources/app/unichat/server/versions.env"):
              line = line.strip()
              if not line or line.startswith("#"): continue
              key, value = line.split("=", 1)
              if key.isupper(): settings[key] = value; continue
              m = re.fullmatch(r"([a-z][a-z0-9_]*)=([\w.-]+/[\w.-]+)@([\w.+-]+):([\w.-]+)", line)
              if not m: sys.exit("Bad versions.env line: " + line)
              bridges.append({"name": m[1], "repo": m[2], "tag": m[3], "prefix": m[4]})
          names = lambda k: {b.strip() for b in settings.get(k, "").split(",") if b.strip()}
          unbuilt, everywhere = names("NATIVES_UNBUILT"), names("NATIVES_ALL")
          unknown = everywhere - {b["name"] for b in bridges}
          if unknown: sys.exit("NATIVES_ALL names no bridge: " + ", ".join(sorted(unknown)))

          def commit(repo, ref):
              """The commit a tag names (peeled, for an annotated tag), or the commit itself."""
              if re.fullmatch(r"[0-9a-f]{40}", ref): return ref
              out = subprocess.run(["git", "ls-remote", "https://github.com/" + repo, "refs/tags/" + ref, "refs/tags/" + ref + "^{}"],
                                   capture_output=True, text=True, check=True).stdout
              refs = {r: sha for sha, r in (l.split("\t") for l in out.splitlines())}
              sha = refs.get("refs/tags/" + ref + "^{}") or refs.get("refs/tags/" + ref)
              if not sha: sys.exit(repo + " has no tag " + ref)
              return sha

          builds = []
          for b in bridges:
              b["commit"] = commit(b["repo"], b["tag"])
              d = "native/patches/" + b["name"]
              b["patches"] = sorted(f for f in os.listdir(d) if f.endswith(".patch")) if os.path.isdir(d) else []
              bad = [f for f in b["patches"] if not re.fullmatch(r"[\w.-]+\.patch", f)]
              if bad: sys.exit("Bad patch name: " + ", ".join(bad))
              # Windows: every bridge but the unbuilt ones, cross-compiled on Linux; macOS: only Unichat's own.
              if b["name"] not in unbuilt: builds.append(dict(b, platform="windows-amd64", runner="ubuntu-latest"))
              if b["name"] in everywhere: builds.append(dict(b, platform="darwin-arm64", runner="macos-15"))
          print("tag=" + settings["NATIVES"].split("@", 1)[1])
          print("tuwunel=" + settings["TUWUNEL_VERSION"])
          print("builds=" + json.dumps(builds))
          EOF
          tag=$(grep '^tag=' "$GITHUB_OUTPUT" | tail -1 | cut -d= -f2)
          if gh release view "$tag" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then echo "exists=true"; else echo "exists=false"; fi >> "$GITHUB_OUTPUT"

  bridges:
    # Windows: cross-compiled from Linux (cgo for SQLite through MinGW; goolm, so no libolm): a minute each, and Linux
    # minutes cost half of Windows'. macOS: on macos-15, cgo with the same tags, so no libolm either.
    needs: plan
    if: needs.plan.outputs.exists != 'true'
    runs-on: ${{ matrix.build.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        build: ${{ fromJSON(needs.plan.outputs.builds) }}
    defaults:
      run:
        shell: bash
    steps:
      # Unichat's own checkout, for the patches and the macOS minimum check only (Unichat's code is not built here).
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          path: unichat
          sparse-checkout: |
            native/patches
            native/check-macos-min.sh
          sparse-checkout-cone-mode: false
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          repository: ${{ matrix.build.repo }}
          ref: ${{ matrix.build.commit }}
          persist-credentials: false
          path: src
      - name: Patches
        working-directory: src
        env:
          PATCHES: ${{ github.workspace }}/unichat/native/patches/${{ matrix.build.name }}
          # What plan found (names checked there): each one must be here and apply, or the build fails.
          PATCH_LIST: ${{ join(matrix.build.patches, ' ') }}
          REPO: ${{ matrix.build.repo }}
          TAG: ${{ matrix.build.tag }}
        run: |
          [ -n "$PATCH_LIST" ] || { echo "No patches for $REPO@$TAG"; exit 0; }
          for name in $PATCH_LIST; do
            p="$PATCHES/$name"
            [ -f "$p" ] || { echo "::error::$name is missing from the checkout"; exit 1; }
            git apply --check "$p" || { echo "::error::$name doesn't apply to $REPO@$TAG"; exit 1; }
            git apply "$p"
            echo "Applied $name"
          done
          git diff --stat
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: src/go.mod
          cache-dependency-path: src/go.sum
      - if: runner.os == 'Linux'
        run: sudo apt-get update -q && sudo apt-get install -y -q gcc-mingw-w64-x86-64
      - name: Build
        working-directory: src
        env:
          CGO_ENABLED: "1"
          # From versions.env: through the environment, never pasted into the script.
          PLATFORM: ${{ matrix.build.platform }}
          PREFIX: ${{ matrix.build.prefix }}
          TAG: ${{ matrix.build.tag }}
          COMMIT: ${{ matrix.build.commit }}
        run: |
          if [ "$PLATFORM" = windows-amd64 ]; then export GOOS=windows GOARCH=amd64 CC=x86_64-w64-mingw32-gcc; fi
          if [ "$PLATFORM" = darwin-arm64 ]; then export GOOS=darwin GOARCH=arm64 MACOSX_DEPLOYMENT_TARGET="$MACOS_MIN"; fi
          # A commit has no release tag: built as mautrix's build.sh does off a tag (main.Tag empty, "+dev.<commit>").
          tag="$TAG"; if printf '%s' "$TAG" | grep -Eq '^[0-9a-f]{40}$'; then tag=""; fi
          # bridgev2 bridges have their main in cmd/<name>; the legacy Discord bridge at the root.
          pkg="./cmd/$PREFIX"; tags=goolm
          if [ ! -d "$pkg" ]; then
            # Legacy bridge (Discord): its mautrix-go has no goolm, only cgo libolm, so no crypto at all (Unichat turns
            # bridge encryption off anyway); and its zeroconfig 0.1 uses log/syslog, missing on Windows. Listed in the
            # release notes.
            pkg=.; tags=goolm,nocrypto
            if [ "$GOOS" = windows ] && grep -q 'go.mau.fi/zeroconfig v0\.1\.' go.mod; then
              go mod edit -require=go.mau.fi/zeroconfig@v0.2.0 && go mod download go.mau.fi/zeroconfig
            fi
          fi
          go build -mod=mod -tags "$tags" -trimpath \
            -ldflags "-s -w -X main.Tag=$tag -X main.Commit=$COMMIT -X 'main.BuildTime=$(date -u '+%b %e %Y, %H:%M:%S')'" \
            -o "../out/$PREFIX-$PLATFORM" "$pkg"
      - name: Smoke (macOS)
        # Windows builds start in smoke-windows; a macOS one here: it runs on MACOS_MIN, --version, and writing its
        # example config.
        if: runner.os == 'macOS'
        env:
          PLATFORM: ${{ matrix.build.platform }}
          PREFIX: ${{ matrix.build.prefix }}
        run: |
          unichat/native/check-macos-min.sh out "$MACOS_MIN"
          f="out/$PREFIX-$PLATFORM"
          "./$f" --version
          # The legacy Discord bridge has no -e (example config): only --version there.
          case "$f" in
            out/mautrix-discord-*) ;;
            *) "./$f" -e -c "$RUNNER_TEMP/$PREFIX.yaml"
               test -s "$RUNNER_TEMP/$PREFIX.yaml" ;;
          esac
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: bridge-${{ matrix.build.name }}-${{ matrix.build.platform }}
          path: out/
          retention-days: 1

  tuwunel:
    needs: plan
    if: needs.plan.outputs.exists != 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            platform: darwin-arm64
            features: ""
          # Without the Linux-only features (jemalloc, io_uring, systemd).
          - os: windows-latest
            platform: windows-amd64
            features: --no-default-features --features brotli_compression,element_hacks,gzip_compression,media_thumbnail,release_max_log_level,url_preview,zstd_compression
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          repository: matrix-construct/tuwunel
          ref: ${{ needs.plan.outputs.tuwunel }}
          persist-credentials: false
      - name: Rust (the version in rust-toolchain.toml)
        run: rustup toolchain install || rustup show
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ needs.plan.outputs.tuwunel }}
      - name: LLVM for rocksdb's bindings (Windows)
        if: runner.os == 'Windows'
        run: clang --version || choco install llvm -y --no-progress
      # Unquoted on purpose: several flags, written in this file (not from data).
      - run: cargo build --release --locked $FEATURES
        env:
          FEATURES: ${{ matrix.features }}
      - name: Collect
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          exe=target/release/tuwunel; [ "$RUNNER_OS" = Windows ] && exe="$exe.exe"
          "$exe" --version
          mkdir out && cp "$exe" "out/tuwunel-$PLATFORM"
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: tuwunel-${{ matrix.platform }}
          path: out/
          retention-days: 1

  smoke-windows:
    # Each Windows build must start: --version, and writing its example config.
    needs: [bridges, tuwunel]
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          path: out
          merge-multiple: true
      - run: |
          cd out
          for f in *-windows-amd64; do
            cp "$f" "$f.exe"
            "./$f.exe" --version
            # Every bridge writes its example config, but the legacy Discord one, which has no -e. Not "a && b",
            # which the loop let fail silently.
            case "$f" in
              mautrix-discord-*) ;;
              mautrix-*) "./$f.exe" -e -c "$RUNNER_TEMP/$f.yaml"
                         test -s "$RUNNER_TEMP/$f.yaml" ;;
            esac
          done

  publish:
    needs: [plan, smoke-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          path: out
          merge-multiple: true
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.plan.outputs.tag }}
          BUILDS: ${{ needs.plan.outputs.builds }}
          TUWUNEL: ${{ needs.plan.outputs.tuwunel }}
        run: |
          cd out
          sha256sum -- *-* > sha256sums.txt
          cat sha256sums.txt
          # The bridges are AGPL-3.0 and tuwunel Apache-2.0: each file's exact source and every change to it is linked here.
          {
            echo "Unichat's local server, the bridges for Windows, and the bridges Unichat builds for every platform, built by natives.yml from their source. Not a version of the app."
            echo
            echo "Source of each file:"
            echo "- tuwunel-*: https://github.com/matrix-construct/tuwunel/tree/$TUWUNEL (Apache-2.0), unmodified"
            echo "$BUILDS" | jq -r '.[] | "- \(.prefix)-\(.platform): https://github.com/\(.repo)/tree/\(.commit) (\(if .tag == .commit then "" else .tag + ", " end)AGPL-3.0)"
              + (if (.patches | length) == 0 then ", unmodified" else ", with " + (.patches | join(", ")) end)'
            echo
            echo "Patches (applied with git apply; a patch that doesn't apply fails the build):"
            echo "$BUILDS" | jq -r --arg base "https://github.com/$GITHUB_REPOSITORY/blob/$GITHUB_SHA/native/patches" \
              '[.[] | .name as $n | .patches[] | "- \($n)/\(.): \($base)/\($n)/\(.)"] | unique | if length == 0 then "- none" else .[] end'
            echo
            echo "Build changes: every bridge is built with \`-tags goolm\` (no libolm). mautrix-discord (legacy) with \`-tags goolm,nocrypto\`, and on Windows \`go mod edit -require=go.mau.fi/zeroconfig@v0.2.0\` (0.1 uses log/syslog, which Windows lacks)."
          } > ../notes.md
          gh release create "$TAG" -R "$GITHUB_REPOSITORY" --prerelease --title "$TAG" --notes-file ../notes.md -- *
