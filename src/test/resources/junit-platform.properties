# The one time limit in the tests: a safety net so a wait that never ends fails instead of hanging the build.
# Tests wait for what happens (FxWait.until, latches), never for a length of time.
junit.jupiter.execution.timeout.default = 3 m

# Extensions every test runs under (META-INF/services): LeftoverMenus fails a test that leaves a context menu showing.
junit.jupiter.extensions.autodetection.enabled = true
