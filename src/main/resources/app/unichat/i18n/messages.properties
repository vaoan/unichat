settings.ai.folderHelp=For example your résumé's folder. Claude Code can only read this folder. Codex can't write, but it can read the rest of the disk.
settings.ai.voiceNotes=Transcribe voice notes
settings.ai.voiceNotesHelp=The voice notes you're answering are turned into text on your computer (Whisper) as soon as you open the chat, so the draft knows what they said without waiting. The first time it downloads the model.
settings.ai.learnStyle=Learn how I write
settings.ai.learnStyleHelp=After each draft, if you wrote something new or corrected a draft, the AI updates in the background what it knows about how you write; it counts from the next draft. It's one more call, but no draft waits for it.
