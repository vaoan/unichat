settings.speech.commandHelp=Any program that takes the audio and writes the text to its output. {archivo}: the audio (WAV, MP3 or FLAC). {idioma}: es, en… or auto. Claude Code and Codex don't transcribe audio; whisper, mlx_whisper or faster-whisper, for example, work.
settings.ai.intro=Adds two buttons next to the text box, using the AI program you have installed: one writes a draft reply and the other fixes the spelling and wording of what you wrote, changing as little as possible. The result stays in the box for you to read and change: it's never sent by itself.
settings.ai.privacy=When you press the draft button, that chat is sent to the Claude Code or Codex service, with your account. Only the loaded messages of that chat are sent, and only when you press it. Photos and videos go as a mention, without their content; the voice notes you answer, as their transcript (made on your computer), if turned on below. To learn how you write, your messages in that chat and what you changed in drafts (with the message each draft answered) are sent; the history of what it learned stays on this computer. When fixing, only what you wrote in the box and what was learned about how you write are sent.
settings.ai.notInstalled={0} is not installed on this computer.
settings.ai.installed=Installed.
settings.ai.program=AI program
settings.ai.instructionsAccessible=Instructions for the AI
settings.ai.instructionsHelp=They're sent with every draft, before the conversation. They aren't used when fixing. When you ask for a draft, what you already wrote in the box is its base, and what you put in [brackets] the AI looks up (in the chat, the folder or the web) and writes in; what it can't find it leaves for you.
